---
layout: default
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&display=swap');

  :root {
    --gold: #9E7C02C9;
    --black: #000000;
    --white: #ffffff;
  }

  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
  }

  header {
    padding: 32px 5vw;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--gold);
  }

  header a {
    color: var(--gold);
    text-decoration: none;
  }

  main {
    max-width: 900px;
    margin: 10vh auto 12vh;
    padding: 0 5vw;
  }

  .date {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
  }

  .release-link {
    margin: 0 0 40px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .release-link strong {
    font-weight: 600;
  }

  .release-link a {
    color: var(--gold);
    text-decoration: none;
  }

  .release-link a:hover {
    color: var(--black);
  }

  h1 {
    font-size: clamp(42px, 7vw, 86px);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -0.025em;
    color: var(--black);
    margin: 0 0 20px;
    text-transform: uppercase;
  }

  .artist {
    font-size: 18px;
    color: var(--gold);
    margin-bottom: 70px;
  }

  .lyrics {
    max-width: 680px;
    font-size: 18px;
    line-height: 1.8;
    white-space: pre-line;
  }

  footer {
    margin-top: 100px;
    padding-top: 25px;
    border-top: 1px solid var(--gold);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  footer a:hover {
    color: var(--black);
  }

  @media (max-width: 600px) {

    header {
      padding: 24px 6vw;
    }

    main {
      margin-top: 7vh;
      padding: 0 6vw;
    }

    h1 {
      font-size: clamp(38px, 12vw, 60px);
    }

    .artist {
      font-size: 16px;
      margin-bottom: 50px;
    }

    .lyrics {
      font-size: 17px;
      line-height: 1.8;
    }
  }
</style>

<header>
  <a href="{{ '/' | relative_url }}">
    Andrew James Pegram
  </a>
</header>

<main>

  <div class="date">
    {{ page.date | date: "%d %B %Y" }}
  </div>

  <div class="release-link">
    <strong>Release:</strong>
    <a href="{{ '/releases/stole-you-from-the-underworld/' | relative_url }}">
      Stole You From The Underworld
    </a>
  </div>

  <h1>{{ page.title }}</h1>

  {% if page.artist %}
  <div class="artist">
    {{ page.artist }}
  </div>
  {% endif %}

  <div class="lyrics">
    {{ content }}
  </div>

  <footer>
    <a href="{{ '/lyrics/' | relative_url }}">
      ← All lyrics
    </a>
  </footer>

</main>
