<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} — {{ site.title }}</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    header {
      padding: 32px 5vw;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    header a {
      color: #fff;
      text-decoration: none;
    }

    main {
      max-width: 720px;
      margin: 12vh auto;
      padding: 0 30px;
    }

    .date {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 80px);
      line-height: 0.95;
      font-weight: 400;
      margin: 0 0 20px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 18px;
      font-style: italic;
      margin-bottom: 80px;
    }

    article {
      font-size: 18px;
    }

    article h1 {
      font-size: 32px;
      margin-top: 60px;
    }

    article p {
      margin: 0 0 28px;
    }

    footer {
      margin-top: 120px;
      padding-top: 30px;
      border-top: 1px solid #333;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>

<header>
  <a href="{{ '/' | relative_url }}">
    Andrew James Pegram
  </a>
</header>

<main>

  <div class="date">
    {{ page.date | date: "%d %B %Y" }}
  </div>

  <h1>{{ page.title }}</h1>

  <div class="subtitle">
    {{ page.excerpt }}
  </div>

  <article>
    {{ content }}
  </article>

  <footer>
    <a href="{{ '/news/' | relative_url }}">← All stories</a>
  </footer>

</main>

</body>
</html>
