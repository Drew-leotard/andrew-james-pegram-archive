---
layout: default
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=IM+Fell+English:ital@0;1&display=swap');

  :root {
    --gold: #9E7C02C9;
    --green: #174A1CCC;
    --black: #000000;
    --white: #ffffff;
  }

  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
  }

  /* ================================
     PAGE
  ================================= */

  .tour-date-page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 5vw 10vh;
  }

  /* ================================
     SITE HEADER
     Matches News / Tour Dates index
  ================================= */

  .site-header {
    padding: 28px 0;
    margin: 0 0 8vh;

    border-bottom: 1px solid var(--gold);

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .site-title {
    color: var(--gold);
    text-decoration: none;
  }

  .site-title:hover {
    color: var(--black);
  }

  /* ================================
     TOUR DATE LAYOUT
  ================================= */

  .tour-date-layout {
    display: grid;
    grid-template-columns: 500px minmax(0, 1fr);
    gap: 70px;
    align-items: start;
  }

  /* ================================
     IMAGE
  ================================= */

  .tour-date-image {
    width: 500px;
    height: 500px;

    background: #f3f3f3;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #999999;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    font-weight: 400;

    text-align: center;
  }

  .tour-date-image span {
    padding: 20px;
  }

  /* ================================
     INFORMATION
  ================================= */

  .tour-date-info {
    width: 100%;
  }

  /* ================================
     TITLE
  ================================= */

  .tour-date-title {
    margin: 0 0 18px;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 34px;
    line-height: 1.15;
    font-weight: 400;

    color: var(--black);
    text-align: left;
  }

  /* ================================
     DATE
  ================================= */

  .tour-date-date {
    margin: 0 0 25px;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    line-height: 1.5;
    font-weight: 400;

    color: var(--gold);
  }

  /* ================================
     DIVIDER
  ================================= */

  .tour-date-divider {
    width: 100%;
    height: 1px;

    margin: 0 0 30px;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );
  }

  /* ================================
     CONTENT
  ================================= */

  .tour-date-content {
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    line-height: 1.65;
    font-weight: 400;

    color: var(--black);
  }

  .tour-date-content p {
    margin: 0 0 24px;
    font-weight: 400;
  }

  .tour-date-content strong {
    font-weight: 400;
  }

  /* ================================
     SECTION HEADINGS
  ================================= */

  .tour-date-content h2 {
    margin: 45px 0 25px;

    font-family: "IM Fell English", Georgia, serif;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 400;

    text-transform: uppercase;
    text-align: left;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ================================
     LINKS
  ================================= */

  .tour-date-content a {
    color: var(--green);
    text-decoration: none;
  }

  .tour-date-content a:hover {
    text-decoration: underline;
  }

  /* ================================
     SOCIAL SHARE
  ================================= */

  .tour-date-share {
    margin-top: 50px;
    padding-top: 22px;

    border-top: 1px solid var(--gold);

    display: flex;
    align-items: center;
    gap: 14px;
  }

  .tour-date-share-label {
    margin-right: 8px;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    line-height: 1;
    font-weight: 400;

    color: var(--gold);
  }

  .tour-date-share a {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;

    border: 1px solid var(--gold);
    border-radius: 50%;

    background: transparent;

    color: var(--gold);
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1;
  }

  .tour-date-share a:hover {
    background: var(--gold);
    color: var(--white);
  }

  /* ================================
     FOOTER
  ================================= */

  .tour-date-footer {
    margin-top: 12vh;
    padding-top: 25px;

    border-top: 1px solid var(--gold);

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .tour-date-footer a {
    color: var(--gold);
    text-decoration: none;
  }

  .tour-date-footer a:hover {
    color: var(--black);
  }

  /* ================================
     MOBILE
  ================================= */

  @media (max-width: 800px) {

    .tour-date-page {
      padding: 0 6vw 8vh;
    }

    .site-header {
      padding: 22px 0;
      margin-bottom: 6vh;
    }

    .tour-date-layout {
      grid-template-columns: 1fr;
      gap: 45px;
    }

    .tour-date-image {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .tour-date-title {
      font-size: 30px;
      line-height: 1.15;
    }

    .tour-date-date {
      font-size: 12px;
    }

    .tour-date-content {
      font-size: 12px;
      line-height: 1.65;
    }

    .tour-date-content h2 {
      font-size: 22px;
    }

    .tour-date-share {
      margin-top: 42px;
    }

    .tour-date-footer {
      margin-top: 8vh;
    }
  }
</style>


<main class="tour-date-page">

  <!-- SITE HEADER -->

  <header class="site-header">

    <a
      class="site-title"
      href="https://andrewjamespegram.carrd.co/"
    >
      Andrew James Pegram
    </a>

  </header>


  <!-- TOUR DATE -->

  <div class="tour-date-layout">


    <!-- IMAGE -->

    <div class="tour-date-image">
      <span>TOUR IMAGE</span>
    </div>


    <!-- INFORMATION -->

    <div class="tour-date-info">


      <!-- TITLE -->

      <h1 class="tour-date-title">
        {{ page.title }}
      </h1>


      <!-- DATE -->

      {% if page.date %}

        <div class="tour-date-date">
          {{ page.date | date: "%d %B %Y" }}
        </div>

      {% endif %}


      <!-- DIVIDER -->

      <div class="tour-date-divider"></div>


      <!-- CONTENT -->

      <article class="tour-date-content">
        {{ content }}
      </article>


      <!-- SOCIAL SHARE -->

      <div class="tour-date-share">

        <span class="tour-date-share-label">
          Share
        </span>

        <!-- Facebook -->

        <a
          href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on Facebook"
          title="Share on Facebook"
        >
          f
        </a>

        <!-- X -->

        <a
          href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on X"
          title="Share on X"
        >
          X
        </a>

        <!-- WhatsApp -->

        <a
          href="https://wa.me/?text={{ page.title | append: ' ' | append: page.url | absolute_url | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on WhatsApp"
          title="Share on WhatsApp"
        >
          WA
        </a>

      </div>

    </div>

  </div>


  <!-- BACK -->

  <footer class="tour-date-footer">

    <a href="{{ '/tour-dates/' | relative_url }}">
      ← All tour dates
    </a>

  </footer>

</main>
