---
layout: default
---

<style>
  :root {
    --gold: #9E7C02C9;
    --green: #174A1CCC;
    --black: #111111;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
  }

  .tour-date-page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 80px 30px 100px;
  }

  /* --------------------------------------------------
     HEADER
  -------------------------------------------------- */

  .site-title {
    display: block;
    width: fit-content;
    margin: 0 auto 14vh;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 30px;
    line-height: 1.1;
    font-weight: 400;
    color: var(--black);
    text-decoration: none;
  }

  .site-title:hover {
    text-decoration: none;
  }

  /* --------------------------------------------------
     MAIN TOUR DATE LAYOUT
  -------------------------------------------------- */

  .tour-date-layout {
    display: grid;
    grid-template-columns: minmax(0, 500px) minmax(0, 1fr);
    gap: 70px;
    align-items: start;
  }

  /* Image placeholder */

  .tour-date-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f3f3f3;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #999999;
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 14px;
    text-align: center;
  }

  .tour-date-image span {
    padding: 20px;
  }

  /* --------------------------------------------------
     TEXT COLUMN
  -------------------------------------------------- */

  .tour-date-info {
    padding-top: 5px;
  }

  .tour-date-title {
    margin: 0 0 18px;

    font-family: "IM Fell English", Georgia, serif;
    font-size: 34px;
    line-height: 1.15;
    font-weight: 400;
    text-transform: uppercase;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tour-date-date {
    margin-bottom: 35px;

    font-size: 14px;
    line-height: 1.4;
  }

  .tour-date-divider {
    width: 100%;
    height: 1px;
    margin: 0 0 35px;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );
  }

  .tour-date-content {
    font-size: 16px;
    line-height: 1.7;
  }

  .tour-date-content p {
    margin: 0 0 30px;
  }

  .tour-date-content h2 {
    margin: 50px 0 30px;

    font-family: "IM Fell English", Georgia, serif;
    font-size: 26px;
    line-height: 1.2;
    font-weight: 400;
    text-transform: uppercase;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tour-date-content strong {
    font-weight: 400;
  }

  .tour-date-content a {
    color: var(--green);
    text-decoration: none;
  }

  .tour-date-content a:hover {
    text-decoration: underline;
  }

  /* --------------------------------------------------
     SOCIAL SHARE
  -------------------------------------------------- */

  .tour-date-share {
    margin-top: 55px;
    padding-top: 25px;

    border-top: 1px solid #9E7C02C9;

    display: flex;
    align-items: center;
    gap: 18px;
  }

  .tour-date-share-label {
    font-family: "IM Fell English", Georgia, serif;
    font-size: 15px;
    text-transform: uppercase;
    color: #777777;
    margin-right: 8px;
  }

  .tour-date-share a {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 34px;
    height: 34px;

    border: 1px solid #111111;
    border-radius: 50%;

    color: #111111;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1;
  }

  .tour-date-share a:hover {
    color: #ffffff;
    background: #111111;
  }

  /* --------------------------------------------------
     FOOTER
  -------------------------------------------------- */

  .tour-date-footer {
    margin-top: 14vh;
    text-align: center;
  }

  .tour-date-footer a {
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 15px;
    color: #111111;
    text-decoration: none;
  }

  .tour-date-footer a:hover {
    text-decoration: underline;
  }

  /* --------------------------------------------------
     MOBILE
  -------------------------------------------------- */

  @media (max-width: 800px) {

    .tour-date-page {
      padding: 45px 22px 70px;
    }

    .site-title {
      font-size: 25px;
      margin-bottom: 10vh;
    }

    .tour-date-layout {
      grid-template-columns: 1fr;
      gap: 45px;
    }

    .tour-date-image {
      max-width: 500px;
      margin: 0 auto;
    }

    .tour-date-info {
      padding-top: 0;
    }

    .tour-date-title {
      font-size: 28px;
    }

    .tour-date-content {
      font-size: 16px;
      line-height: 1.65;
    }

    .tour-date-content h2 {
      font-size: 23px;
    }

    .tour-date-share {
      margin-top: 45px;
    }

    .tour-date-footer {
      margin-top: 10vh;
    }
  }
</style>


<main class="tour-date-page">

  <!-- Site header -->

  <a
    class="site-title"
    href="https://andrewjamespegram.carrd.co/"
  >
    Andrew James Pegram
  </a>


  <!-- Tour date -->

  <div class="tour-date-layout">

    <!-- Image placeholder -->

    <div class="tour-date-image">
      <span>TOUR IMAGE</span>
    </div>


    <!-- Tour information -->

    <div class="tour-date-info">

      <h1 class="tour-date-title">
        {{ page.title }}
      </h1>

      {% if page.date %}
        <div class="tour-date-date">
          {{ page.date | date: "%d %B %Y" }}
        </div>
      {% endif %}

      <div class="tour-date-divider"></div>

      <article class="tour-date-content">
        {{ content }}
      </article>


      <!-- Social sharing -->

      <div class="tour-date-share">

        <span class="tour-date-share-label">
          Share
        </span>

        <a
          href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on Facebook"
          title="Share on Facebook"
        >
          f
        </a>

        <a
          href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on X"
          title="Share on X"
        >
          X
        </a>

        <a
          href="https://wa.me/?text={{ page.title | append: ' ' | append: page.url | absolute_url | url_encode }}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Share on WhatsApp"
          title="Share on WhatsApp"
        >
          WA
        </a>

      </div>

    </div>

  </div>


  <!-- Back -->

  <footer class="tour-date-footer">

    <a href="{{ '/tour-dates/' | relative_url }}">
      ← All tour dates
    </a>

  </footer>

</main>
