---
layout: default
---

<style>
  :root {
    --gold: #9E7C02C9;
    --green: #174A1CCC;
    --black: #111111;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
  }

  .tour-date-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 30px 100px;
  }

  .site-title {
    display: block;
    width: fit-content;
    margin: 0 auto 18vh;

    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 30px;
    line-height: 1.1;
    font-weight: 400;
    text-decoration: none;

    color: var(--black);
  }

  .site-title:hover {
    text-decoration: none;
  }

  .tour-date-title {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 10vh;

    font-family: "IM Fell English", Georgia, serif;
    font-size: 32px;
    line-height: 1.15;
    font-weight: 400;
    letter-spacing: 0;
    text-align: center;
    text-transform: uppercase;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tour-date-content {
    max-width: 680px;
    margin: 0 auto;
    font-size: 17px;
    line-height: 1.7;
  }

  .tour-date-content p {
    margin: 0 0 32px;
  }

  .tour-date-content h2 {
    margin: 70px 0 35px;

    font-family: "IM Fell English", Georgia, serif;
    font-size: 26px;
    line-height: 1.2;
    font-weight: 400;
    text-transform: uppercase;
    text-align: center;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tour-date-content strong {
    font-weight: 400;
  }

  .tour-date-content a {
    color: var(--green);
    text-decoration: none;
  }

  .tour-date-content a:hover {
    text-decoration: underline;
  }

  .tour-date-footer {
    margin-top: 12vh;
    text-align: center;
  }

  .tour-date-footer a {
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 15px;
    color: #111111;
    text-decoration: none;
  }

  .tour-date-footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 700px) {
    .tour-date-page {
      padding: 45px 22px 70px;
    }

    .site-title {
      font-size: 25px;
      margin-bottom: 13vh;
    }

    .tour-date-title {
      font-size: 27px;
      margin-bottom: 8vh;
    }

    .tour-date-content {
      font-size: 16px;
      line-height: 1.65;
    }

    .tour-date-content h2 {
      font-size: 23px;
      margin-top: 55px;
    }

    .tour-date-footer {
      margin-top: 10vh;
    }
  }
</style>

<main class="tour-date-page">

  <a
    class="site-title"
    href="https://andrewjamespegram.carrd.co/"
  >
    Andrew James Pegram
  </a>

  <h1 class="tour-date-title">
    {{ page.title }}
  </h1>

  <article class="tour-date-content">
    {{ content }}
  </article>

  <footer class="tour-date-footer">
    <a href="{{ '/tour-dates/' | relative_url }}">
      ← All tour dates
    </a>
  </footer>

</main>
