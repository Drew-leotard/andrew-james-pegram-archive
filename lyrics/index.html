---
layout: default
title: Lyrics
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&display=swap');

  :root {
    --gold: #9E7C02C9;
    --black: #000000;
    --white: #ffffff;
  }

  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
  }

  header {
    padding: 32px 5vw;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--gold);
  }

  header a {
    color: var(--gold);
    text-decoration: none;
  }

  main {
    max-width: 1100px;
    margin: 10vh auto 12vh;
    padding: 0 5vw;
  }

  .section-title {
    font-size: clamp(48px, 8vw, 100px);
    line-height: 0.9;
    font-weight: 400;
    letter-spacing: -0.025em;
    color: var(--black);
    text-transform: uppercase;
    margin: 0 0 15vh;
  }

  .story {
    margin-bottom: 12vh;
  }

  .story-date {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }

  .story-title {
    font-size: clamp(32px, 5vw, 64px);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 0;
  }

  .story-title a {
    color: var(--black);
    text-decoration: none;
  }

  .story-title a:hover {
    color: var(--gold);
  }

  footer {
    margin-top: 15vh;
    padding: 30px 0 60px;
    border-top: 1px solid var(--gold);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  footer a:hover {
    color: var(--black);
  }

  @media (max-width: 600px) {

    header {
      padding: 24px 6vw;
    }

    main {
      margin-top: 7vh;
      padding: 0 6vw;
    }

    .section-title {
      font-size: clamp(42px, 12vw, 60px);
      margin-bottom: 10vh;
    }

    .story {
      margin-bottom: 10vh;
    }

    .story-title {
      font-size: clamp(30px, 9vw, 48px);
    }
  }
</style>

<header>

  <a href="{{ '/' | relative_url }}">
    Andrew James Pegram
  </a>

</header>

<main>

  <h1 class="section-title">Lyrics</h1>

  {% assign lyrics = site.lyrics | sort: "date" | reverse %}

  {% for lyric in lyrics %}

  <article class="story">

    <div class="story-date">
      {{ lyric.date | date: "%d %B %Y" }}
    </div>

    <h2 class="story-title">

      <a href="{{ lyric.url | relative_url }}">
        {{ lyric.artist }} — {{ lyric.title }}
      </a>

    </h2>

  </article>

  {% endfor %}

  <footer>

    <a href="https://andrewjamespegram.carrd.co/">
  ← Home
</a>

  </footer>

</main>
