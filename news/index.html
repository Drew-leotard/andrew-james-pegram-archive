---
layout: default
title: News
---

<style>
  @import url('https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=IM+Fell+English:ital@0;1&display=swap');

  :root {
    --gold: #9E7C02C9;
    --green: #174A1CCC;
    --black: #000000;
    --white: #ffffff;
  }

  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
  }

  header {
    padding: 28px 5vw;
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--gold);
  }

  header a {
    color: var(--gold);
    text-decoration: none;
  }

  main {
    max-width: 1000px;
    margin: 8vh auto 10vh;
    padding: 0 5vw;
  }

  .section-title {
    display: inline-block;
    font-family: "IM Fell English", Georgia, serif;
    font-size: clamp(42px, 6vw, 72px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: uppercase;
    margin: 0 0 10vh;

    background: linear-gradient(
      90deg,
      var(--gold) 0%,
      var(--green) 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .story {
    margin-bottom: 9vh;
  }

  .story-date {
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .story-title {
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: clamp(24px, 3vw, 38px);
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .story-title a {
    color: var(--black);
    text-decoration: none;
  }

  .story-title a:hover {
    color: var(--gold);
  }

  .story-description {
    max-width: 600px;
    margin-top: 14px;
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--black);
  }

  footer {
    margin-top: 12vh;
    padding-top: 25px;
    border-top: 1px solid var(--gold);
    font-family: "Hedvig Letters Serif", Georgia, serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  footer a:hover {
    color: var(--black);
  }

  @media (max-width: 600px) {

    header {
      padding: 22px 6vw;
    }

    main {
      margin-top: 6vh;
      padding: 0 6vw;
    }

    .section-title {
      font-size: clamp(40px, 12vw, 58px);
      margin-bottom: 8vh;
    }

    .story {
      margin-bottom: 8vh;
    }

    .story-title {
      font-size: clamp(23px, 7vw, 32px);
    }

    .story-description {
      font-size: 15px;
    }
  }
</style>

<header>
  <a href="https://andrewjamespegram.carrd.co/">
    Andrew James Pegram
  </a>
</header>

<main>

  <h1 class="section-title">News</h1>

  {% assign stories = site.stories | sort: "date" | reverse %}

  {% for story in stories %}

    <article class="story">

      <div class="story-date">
        {{ story.date | date: "%d %B %Y" }}
      </div>

      <h2 class="story-title">
        <a href="{{ story.url | relative_url }}">
          {{ story.title }}
        </a>
      </h2>

      {% if story.excerpt %}
        <div class="story-description">
          {{ story.excerpt }}
        </div>
      {% endif %}

    </article>

  {% endfor %}

  <footer>
    <a href="https://andrewjamespegram.carrd.co/">
      ← Home
    </a>
  </footer>

</main>
